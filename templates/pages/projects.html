{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h4><a class="accent-txt" href="{{ trans(key='href1', lang=lang) }}">{{section.extra.parent}}</a>{{section.extra.preTitle}}</h4>

    <div class="page-name">
        <h1>{{section.title}}</h1>
        <span class="page-separator accent-bg"></span>
    </div>

    <div id="project-container">

       {% for p in section.pages %}

            
            <a class="project-div" href="{{ p.extra.link }}">
                <img class="project-img" src="/images/{{ p.extra.img }}" />
                <h3>{{ p.title }}</h3>
            </a>
        

       {% endfor %}

    </div>

</div>

<style>

    #project-container {
        display: grid;
        grid-template-columns: 25vw 25vw 25vw;
        gap: 5vw;

        padding-top: 1rem;
    }

    .project-div {
        background: var(--header-bg);
        border-radius: 1rem; padding-bottom: 1rem;
        overflow: hidden;
        display: flex; flex-direction: column; gap: 1rem;
        align-items: center; 
    }

    .project-img {
        
        aspect-ratio: 1;
        width: 100%;
        height: auto;

    }

    @media (max-width: 800px) {
        #project-container {
            grid-template-columns: 40vw 40vw;
            gap: 10vw;
        }
        h3 {
            transform: scale(0.8);
        }
    }

</style>

{% endblock content %}
