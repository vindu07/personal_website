{% extends "base.html" %}

{% block content %}
<div class="page-container">
    <h4><a class="accent-txt" href="{{ trans(key='href1', lang=lang) }}">{{section.extra.parent}}</a>{{section.extra.preTitle}}</h4>

    <div class="page-name">
        <h1>{{section.title}}</h1>
        <span class="page-separator accent-bg"></span>
    </div>

    <div id="project-container">

       {% for p in section.pages %}

            <div class="project-div">
                <a href="{{ p.permalink }}"></a>
                    <img class="project-img" src="/static/images/{{ p.extra.img }}" />
                    <h3>{{ p.title }}</h3>
                </a>
            </div>

       {% endfor %}

    </div>

</div>

<style>

    #project-container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 1rem;

        padding-top: 1rem;
    }

    .project-div {
        display: flex; flex-direction: column; gap: 1rem;
        align-items: center; 
    }

    .project-img {
        
        width: 8rem;
        height: 8rem;
  
        border-radius: 1rem;
    }

    @media (max-width: 800px) {
        #project-container {
            grid-template-columns: 1fr 1fr;
        }
        .project-img {
        
            width: 6rem;
            height: 6rem;
    
            border-radius: 1rem;
        }
        h3 {
            transform: scale(0.8);
        }
    }

</style>

{% endblock content %}
