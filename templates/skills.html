<style>
    #skill-container {
        display: grid; gap: 1rem;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
        
    }
    .skill {
        background: var(--header-bg);
        padding: .5rem; border-radius: .5rem;
        display: flex; flex-direction: column; gap: .5rem; align-items: center;
        max-width: 5rem;
    }
    .skill-icons {
        height: 3rem; width: 3rem;
    }
    .skill-progress {
        display: none;
        height: .5rem; width: 4rem;
        border: none; border-radius: .25rem;
    }
    .skill-progress::-webkit-progress-bar {
        background: var(--text);
        border-radius: .5rem;
    }
    .skill-progress::-moz-progress-bar {
        background: var(--text);
        border-radius: .5rem;
    }
    .skill-progress::-webkit-progress-value {
        background: var(--accent-1);
        border-radius: .5rem;
        transition: width 3s;
    }
    .skill-progress::-moz-progress-value {
        background: var(--accent-1);
        border-top-left-radius: .5rem;
        border-bottom-left-radius: .5rem;
        transition: width 3s;
    }

    @media (max-width: 800px) {
        #skill-container {
        display: grid; gap: 1rem;
        grid-template-columns: 1fr 1fr 1fr; 
        }
    }
</style>

{% endblock content %}
