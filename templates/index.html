{% extends "base.html" %}

{% block content %}
<div id="container">
    <h4 class="accent-txt">HELLO, I'M</h4>

    <div id="name">
        <h1>Andrea Vinduska</h1>
        <h3 class="accent-txt"><i>Industrial Engineering Student</i></h3>
    </div>

    <span id="separator" class="accent-bg"></span>

    <div id="desc">
        <p>Curious about how things work. Passionate about robotics,</p>
        <p>mechatronics, and solving real-world problems.</p>
    </div>

    <div id="buttons">
        <button class="accent-bg dynamic"><a href="/projects"><h6>View my work</h6></a></button>
        <button class="dynamic"><a href="/contact"><h6>Contact me</h6></a></button>
    </div>

    <div id="icons">
        <p></p>
    </div>
</div>

<style>
    #container {
        display: flex; flex-direction: column; gap: 2rem;
    }
    #name {
        display: flex; flex-direction: column; gap: 0;
    }
    #desc {
        display: flex; flex-direction: column; gap: .5rem;
    }
    #buttons {
        display: flex; flex-direction: row; gap: 2rem;
    }
    #separator {
        height: 0.25rem;
        width: 3rem;
        border-radius: 0.2rem;
    }
</style>


{% endblock content %}
